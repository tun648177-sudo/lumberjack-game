<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>LumberJack</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

body{
    background:#78cfff;
}

#game{
    position:relative;
    width:100%;
    max-width:500px;
    height:100vh;
    height:100dvh;
    margin:auto;
    overflow:hidden;
    background:
    linear-gradient(
        to bottom,
        #70cfff 0%,
        #c9efff 50%,
        #76bd55 50%,
        #4b963b 100%
    );
}

/* SKY */

.sun{
    position:absolute;
    top:65px;
    right:25px;
    width:65px;
    height:65px;
    border-radius:50%;
    background:#ffe66d;
    box-shadow:0 0 30px rgba(255,230,109,.8);
}

.cloud{
    position:absolute;
    width:100px;
    height:28px;
    border-radius:30px;
    background:white;
    opacity:.8;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:white;
}

.cloud:before{
    width:45px;
    height:45px;
    left:15px;
    top:-20px;
}

.cloud:after{
    width:55px;
    height:55px;
    right:10px;
    top:-28px;
}

.cloud.one{
    top:100px;
    left:5%;
}

.cloud.two{
    top:185px;
    right:5%;
    transform:scale(.7);
}

/* TOP */

#top{
    position:absolute;
    top:10px;
    left:0;
    width:100%;
    text-align:center;
    z-index:100;
}

.title{
    color:white;
    font-size:28px;
    font-weight:900;
    letter-spacing:1px;
    text-shadow:
    2px 3px 0 #583219,
    0 4px 8px rgba(0,0,0,.3);
}

.stats{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:7px;
}

.stat{
    min-width:95px;
    padding:7px 13px;
    border-radius:20px;
    color:white;
    background:rgba(0,0,0,.45);
    font-size:18px;
    font-weight:bold;
}

#time{
    background:#e74c3c;
}

#rankBtn{
    position:absolute;
    top:14px;
    right:12px;
    z-index:110;
    border:0;
    padding:9px 12px;
    border-radius:15px;
    background:white;
    font-weight:bold;
}

/* TREE AREA */

#treeArea{
    position:absolute;
    left:50%;
    bottom:90px;
    width:190px;
    height:520px;
    transform:translateX(-50%);
}

/* TRUNK */

#trunk{
    position:absolute;
    left:75px;
    bottom:0;
    width:40px;
    height:100%;
    border-radius:10px;
    background:
    linear-gradient(
        90deg,
        #5b2e0d,
        #a45e27,
        #71360e
    );
    box-shadow:4px 0 12px rgba(0,0,0,.25);
}

#trunk:after{
    content:"";
    position:absolute;
    left:8px;
    top:25px;
    width:24px;
    height:5px;
    border-radius:50%;
    background:rgba(60,25,5,.4);
    box-shadow:
    0 60px rgba(60,25,5,.35),
    0 125px rgba(60,25,5,.35),
    0 200px rgba(60,25,5,.3),
    0 280px rgba(60,25,5,.3),
    0 360px rgba(60,25,5,.3);
}

/* BRANCH */

.branch{
    position:absolute;
    width:120px;
    height:30px;
    border-radius:20px;
    background:
    linear-gradient(
        #45b63d,
        #176e28
    );
    box-shadow:0 4px 6px rgba(0,0,0,.25);
    z-index:10;
}

.branch:before,
.branch:after{
    content:"";
    position:absolute;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#2f9637;
}

.branch:before{
    left:12px;
    top:-25px;
}

.branch:after{
    right:8px;
    top:-23px;
}

.branch.left{
    left:-50px;
}

.branch.right{
    right:-50px;
}

/* LUMBERJACK */

#player{
    position:absolute;
    left:50%;
    bottom:48px;
    width:135px;
    height:175px;
    transform:translateX(-50%);
    z-index:50;
    transition:transform .12s ease;
}

/* HEAD */

.head{
    position:absolute;
    top:25px;
    left:43px;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#f2b37d;
    border:3px solid #9b5d35;
    z-index:5;
}

.head:before{
    content:"";
    position:absolute;
    top:19px;
    left:12px;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#222;
    box-shadow:18px 0 #222;
}

.head:after{
    content:"";
    position:absolute;
    left:16px;
    bottom:8px;
    width:15px;
    height:5px;
    border-bottom:2px solid #63351e;
    border-radius:50%;
}

/* HAIR */

.hair{
    position:absolute;
    top:17px;
    left:39px;
    width:56px;
    height:23px;
    border-radius:50% 50% 20% 20%;
    background:#442817;
    z-index:7;
}

/* HAT */

.hat{
    position:absolute;
    top:4px;
    left:30px;
    width:70px;
    height:25px;
    border-radius:50%;
    background:#d93636;
    z-index:10;
}

.hat:after{
    content:"";
    position:absolute;
    left:-8px;
    bottom:-5px;
    width:86px;
    height:8px;
    border-radius:10px;
    background:#a92525;
}

/* BODY */

.body{
    position:absolute;
    top:70px;
    left:36px;
    width:62px;
    height:72px;
    border-radius:18px 18px 10px 10px;
    background:
    linear-gradient(
        #e84a3c,
        #a92f2a
    );
    z-index:4;
}

/* ARMS */

.arm{
    position:absolute;
    top:74px;
    width:19px;
    height:62px;
    border-radius:12px;
    background:#f2b37d;
    z-index:3;
}

.arm.left{
    left:22px;
    transform:rotate(25deg);
}

.arm.right{
    right:20px;
    transform:rotate(-30deg);
}

/* LEGS */

.leg{
    position:absolute;
    top:135px;
    width:23px;
    height:45px;
    border-radius:8px;
    background:#34495e;
}

.leg.left{
    left:38px;
}

.leg.right{
    right:29px;
}

/* AXE */

.axe{
    position:absolute;
    top:50px;
    right:-30px;
    font-size:62px;
    transform:rotate(-35deg);
    z-index:20;
    transition:transform .13s ease;
}

/* CHOP */

#player.chopLeft{
    transform:
    translateX(-50%)
    rotate(-7deg);
}

#player.chopRight{
    transform:
    translateX(-50%)
    rotate(7deg);
}

#player.chopLeft .axe{
    transform:
    rotate(-115deg)
    translate(-12px,18px);
}

#player.chopRight .axe{
    transform:
    rotate(-65deg)
    translate(8px,15px);
}

/* BUTTONS */

#buttons{
    position:absolute;
    left:0;
    bottom:15px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:18px;
    z-index:80;
}

.control{
    width:140px;
    height:65px;
    border:0;
    border-radius:20px;
    color:white;
    font-size:32px;
    font-weight:bold;
    background:
    linear-gradient(
        #3498db,
        #236da5
    );
    box-shadow:
    0 6px 0 #154d73,
    0 8px 15px rgba(0,0,0,.3);
}

.control:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #154d73;
}

/* HIT */

.hit{
    position:absolute;
    left:50%;
    bottom:300px;
    z-index:200;
    font-size:45px;
    pointer-events:none;
    animation:
    hitAnim .4s ease-out forwards;
}

@keyframes hitAnim{

    0%{
        opacity:1;
        transform:
        translateX(-50%)
        scale(.5);
    }

    100%{
        opacity:0;
        transform:
        translateX(-50%)
        translateY(-60px)
        scale(1.5);
    }

}

/* GAME OVER */

#gameOver{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:500;
    color:white;
    background:rgba(0,0,0,.85);
}

#gameOver h1{
    margin:0 0 12px;
    color:#ffe066;
    font-size:45px;
    text-shadow:3px 3px #000;
}

.result{
    margin:5px;
    font-size:24px;
}

.restart{
    margin-top:20px;
    width:210px;
    height:60px;
    border:0;
    border-radius:18px;
    color:white;
    background:#2ecc71;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 5px 0 #1e8449;
}

/* LEADERBOARD */

#leaderboard{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    z-index:600;
    padding:30px 20px;
    color:white;
    background:
    rgba(10,20,30,.97);
}

#leaderboard h2{
    color:#ffe066;
    font-size:30px;
}

#ranking{
    width:100%;
    max-width:400px;
    max-height:60vh;
    overflow-y:auto;
}

.rank{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:7px 0;
    padding:12px 15px;
    border-radius:12px;
    background:rgba(255,255,255,.1);
    font-size:18px;
}

.rank:first-child{
    background:rgba(255,215,0,.25);
}

.rank:nth-child(2){
    background:rgba(192,192,192,.2);
}

.rank:nth-child(3){
    background:rgba(205,127,50,.25);
}

.back{
    margin-top:18px;
    width:180px;
    height:50px;
    border:0;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
}

</style>
</head>

<body>

<div id="game">

<div class="sun"></div>
<div class="cloud one"></div>
<div class="cloud two"></div>

<!-- TOP -->

<div id="top">

<div class="title">
🪓 LUMBERJACK
</div>

<div class="stats">

<div class="stat" id="score">
🏆 0
</div>

<div class="stat" id="time">
⏱️ 30
</div>

</div>

</div>

<button id="rankBtn" onclick="openRanking()">
🏆 Ranking
</button>

<!-- TREE -->

<div id="treeArea">

<div id="trunk"></div>

</div>

<!-- PLAYER -->

<div id="player">

<div class="hat"></div>
<div class="hair"></div>
<div class="head"></div>

<div class="body"></div>

<div class="arm left"></div>
<div class="arm right"></div>

<div class="leg left"></div>
<div class="leg right"></div>

<div class="axe">🪓</div>

</div>

<!-- CONTROLS -->

<div id="buttons">

<button class="control"
onclick="chop('left')">
⬅️
</button>

<button class="control"
onclick="chop('right')">
➡️
</button>

</div>

<!-- GAME OVER -->

<div id="gameOver">

<h1>GAME OVER</h1>

<div class="result">
🏆 Score:
<span id="finalScore">0</span>
</div>

<div class="result">
⭐ Best:
<span id="bestScore">0</span>
</div>

<button class="restart"
onclick="restart()">
🔄 PLAY AGAIN
</button>

<button class="back"
onclick="openRanking()">
🏆 LEADERBOARD
</button>

</div>

<!-- LEADERBOARD -->

<div id="leaderboard">

<h2>🏆 LEADERBOARD</h2>

<div id="ranking"></div>

<button class="back"
onclick="closeRanking()">
⬅️ BACK
</button>

</div>

<script>

/* GAME VARIABLES */

let score=0;
let time=30;
let running=true;

let branches=[];

const tree=
document.getElementById(
"treeArea"
);

const player=
document.getElementById(
"player"
);

const scoreText=
document.getElementById(
"score"
);

const timeText=
document.getElementById(
"time"
);

const gameOver=
document.getElementById(
"gameOver"
);

const leaderboard=
document.getElementById(
"leaderboard"
);

const ranking=
document.getElementById(
"ranking"
);


/* CREATE BRANCH */

function createBranch(
side,
bottom
){

const branch=
document.createElement(
"div"
);

branch.className=
"branch "+side;

branch.style.bottom=
bottom+"px";

tree.appendChild(
branch
);

branches.push({
element:branch,
side:side
});

}


/* INITIAL TREE */

function createTree(){

document
.querySelectorAll(
".branch"
)
.forEach(
b=>b.remove()
);

branches=[];

createBranch(
"left",
100
);

createBranch(
"right",
180
);

createBranch(
"left",
260
);

createBranch(
"right",
340
);

}


/* CHOP */

function chop(side){

if(!running)
return;

player.classList.remove(
"chopLeft",
"chopRight"
);

void player.offsetWidth;

if(side==="left"){

player.classList.add(
"chopLeft"
);

}else{

player.classList.add(
"chopRight"
);

}

setTimeout(()=>{

player.classList.remove(
"chopLeft",
"chopRight"
);

},180);


/* CHECK BRANCH */

const branch=
branches[0];

if(branch){

if(branch.side===side){

endGame();

return;

}

branch.element.remove();

branches.shift();

}


/* SCORE */

score++;

scoreText.innerText=
"🏆 "+score;

showHit();


/* NEW BRANCH */

let newSide=
Math.random()<.5
?"left"
:"right";

createBranch(
newSide,
430
);

}


/* HIT EFFECT */

function showHit(){

const hit=
document.createElement(
"div"
);

hit.className="hit";

hit.innerText="💥";

document
.getElementById("game")
.appendChild(
hit
);

setTimeout(
()=>{
hit.remove();
},
400
);

}


/* TIMER */

setInterval(
()=>{

if(!running)
return;

time--;

timeText.innerText=
"⏱️ "+time;

if(time<=0){

endGame();

}

},
1000
);


/* END GAME */

function endGame(){

if(!running)
return;

running=false;

document
.getElementById(
"finalScore"
)
.innerText=score;

let best=
Number(
localStorage.getItem(
"lumberjackBest"
)||0
);

if(score>best){

best=score;

localStorage.setItem(
"lumberjackBest",
best
);

}

document
.getElementById(
"bestScore"
)
.innerText=best;

saveScore();

gameOver.style.display=
"flex";

}


/* RESTART */

function restart(){

score=0;

time=30;

running=true;

scoreText.innerText=
"🏆 0";

timeText.innerText=
"⏱️ 30";

gameOver.style.display=
"none";

createTree();

}


/* SAVE SCORE */

function saveScore(){

let scores=
JSON.parse(
localStorage.getItem(
"lumberjackScores"
)||"[]"
);

scores.push({

name:"Player",

score:score

});

scores.sort(
(a,b)=>
b.score-a.score
);

scores=
scores.slice(
0,
50
);

localStorage.setItem(
"lumberjackScores",
JSON.stringify(
scores
)
);

}


/* OPEN RANKING */

function openRanking(){

gameOver.style.display=
"none";

leaderboard.style.display=
"flex";

let scores=
JSON.parse(
localStorage.getItem(
"lumberjackScores"
)||"[]"
);

ranking.innerHTML="";

if(scores.length===0){

ranking.innerHTML=
"<div class='rank'>No scores yet</div>";

return;

}

scores.forEach(
(item,index)=>{

let row=
document.createElement(
"div"
);

row.className="rank";

let medal=
index===0
?"🥇"
:
index===1
?"🥈"
:
index===2
?"🥉"
:
"🏅";

row.innerHTML=
"<span>"+
medal+
" #"+
(index+1)+
" "+
item.name+
"</span>"+
"<strong>"+
item.score+
"</strong>";

ranking.appendChild(
row
);

}
);

}


/* CLOSE RANKING */

function closeRanking(){

leaderboard.style.display=
"none";

}


/* KEYBOARD */

document.addEventListener(
"keydown",
function(e){

if(e.key==="ArrowLeft"){

chop("left");

}

if(e.key==="ArrowRight"){

chop("right");

}

}
);


/* START */

createTree();

</script>

</div>

</body>
    </html>
