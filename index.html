<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumberJack Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #70c5ce;
            overflow: hidden;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 360px;
            height: 560px;
            background: #87ceeb;
            overflow: hidden;
            border-bottom: 50px solid #55a020;
        }
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50px;
        }
        #score, #timer {
            position: absolute;
            top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px #000;
        }
        #score { left: 30px; }
        #timer { right: 30px; }
        
        /* ဇာတ်ကောင်နဲ့ ပစ္စည်းများအတွက် Canvas */
        canvas {
            display: block;
        }
        
        .btn-container {
            display: flex;
            width: 360px;
            justify-content: space-between;
            margin-top: 10px;
        }
        .control-btn {
            width: 170px;
            height: 70px;
            background: #3b82f6;
            border: none;
            border-radius: 12px;
            font-size: 28px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px #1d4ed8;
        }
        .control-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #1d4ed8;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score">Score: <span id="score-val">0</span></div>
        <div id="timer">Time: <span id="timer-val">30</span></div>
        <canvas id="gameCanvas" width="360" height="510"></canvas>
    </div>

    <div class="btn-container">
        <button class="control-btn" onclick="chop('left')">⬅️</button>
        <button class="control-btn" onclick="chop('right')">➡️</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let timeLeft = 30;
    let gameInterval;
    let isPlaying = true;

    // သစ်ပင်နဲ့ သစ်ကိုင်းများ
    let treeTrunks = []; // အောက်ကနေ အပေါ်ကို တက်မယ့် သစ်ပိုင်းများ
    // 0 = အလွတ်, 1 = ဘယ်ဘက်ကိုင်း, 2 = ညာဘက်ကိုင်း
    let branches = [0, 0, 1, 0, 2, 0, 1, 0, 0, 2]; 

    let playerSide = 'left'; // 'left' သို့မဟုတ် 'right'

    function initGame() {
        score = 0;
        timeLeft = 30;
        isPlaying = true;
        document.getElementById('score-val').innerText = score;
        document.getElementById('timer-val').innerText = timeLeft;
        
        // အချိန်ဆင်းရန်
        gameInterval = setInterval(() => {
            if(timeLeft > 0 && isPlaying) {
                timeLeft--;
                document.getElementById('timer-val').innerText = timeLeft;
            } else if(timeLeft <= 0) {
                isPlaying = false;
                alert("Game Over! Score: " + score);
            }
        }, 1000);

        draw();
    }

    function chop(side) {
        if (!isPlaying) return;
        
        playerSide = side;

        // သစ်ကိုင်းနဲ့ တိုက်မိခြင်း စစ်ဆေးရန် (အောက်ဆုံး သစ်ကိုင်းကို စစ်သည်)
        let currentBranch = branches[0];
        if ((side === 'left' && currentBranch === 1) || (side === 'right' && currentBranch === 2)) {
            isPlaying = false;
            alert("Game Over! Branch hit you. Score: " + score);
            return;
        }

        // ရမှတ်တိုးပြီး သစ်ကိုင်းများကို တစ်ကွက်စီ ရွှေ့ရန်
        score++;
        document.getElementById('score-val').innerText = score;
        timeLeft += 1; // တစ်ချက်ခုတ်တိုင်း အချိန်အနည်းငယ် တိုးပေးသည်

        branches.shift(); // အောက်ဆုံးက သစ်ကိုင်းထွက်သွား
        // အသစ်တစ်ခု ကျပန်းထည့်သည် (0: အလွတ်, 1: ဘယ်သစ်ကိုင်း, 2: ညာသစ်ကိုင်း)
        let rand = Math.random();
        let newB = rand < 0.4 ? 0 : (rand < 0.7 ? 1 : 2);
        branches.push(newB);

        draw();
    }

    function draw() {
        // ကောင်းကင် နောက်ခံ
        ctx.fillStyle = "#87ceeb";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // တိမ်တိုက်များ
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(60, 80, 25, 0, Math.PI * 2);
        ctx.arc(85, 75, 30, 0, Math.PI * 2);
        ctx.arc(110, 80, 25, 0, Math.PI * 2);
        ctx.fill();

        // 🟢 သစ်ပင် ပင်စည် (အလယ်တည့်တည့်)
        let treeX = 140;
        let treeWidth = 80;
        ctx.fillStyle = "#8B5A2B";
        ctx.fillRect(treeX, 50, treeWidth, canvas.height - 50);

        // သစ်ပင် အကြောအခြမ်းမျဉ်းများ
        ctx.strokeStyle = "#5C4033";
        ctx.lineWidth = 3;
        for(let i = 100; i < canvas.height; i += 50) {
            ctx.beginPath();
            ctx.moveTo(treeX, i);
            ctx.lineTo(treeX + treeWidth, i);
            ctx.stroke();
        }

        // 🌿 သစ်ကိုင်းများ (Branches) ဆွဲရန်
        for (let i = 0; i < branches.length; i++) {
            let bType = branches[i];
            let yPos = 420 - (i * 45); // အောက်ကနေ အပေါ်ကို စီပေးသည်

            if (bType === 1) {
                // ဘယ်ဘက် သစ်ကိုင်း
                ctx.fillStyle = "#2e8b57";
                ctx.beginPath();
                ctx.roundRect(treeX - 90, yPos, 90, 25, 10);
                ctx.fill();
            } else if (bType === 2) {
                // ညာဘက် သစ်ကိုင်း
                ctx.fillStyle = "#2e8b57";
                ctx.beginPath();
                ctx.roundRect(treeX + treeWidth, yPos, 90, 25, 10);
                ctx.fill();
            }
        }

        // 🧍‍♂️ ဇာတ်ကောင် (Lumberjack) ဆွဲရန်
        let charX = (playerSide === 'left') ? 50 : 230;
        let charY = 380;

        // ခန္ဓာကိုယ် (အနီရောင် ရှပ်အင်္ကျီ)
        ctx.fillStyle = "#dc2626";
        ctx.fillRect(charX, charY, 50, 60);

        // ခေါင်း (အသားရောင်)
        ctx.fillStyle = "#fcd34d";
        ctx.beginPath();
        ctx.arc(charX + 25, charY - 15, 20, 0, Math.PI * 2);
        ctx.fill();

        // ဦးထုပ် (အနီရောင် ဦးထုပ်အပြား)
        ctx.fillStyle = "#b91c1c";
        ctx.fillRect(charX + 2, charY - 32, 46, 10);

        // မျက်နှာ (မျက်လုံးနဲ့ အပြုံး)
        ctx.fillStyle = "#000";
        ctx.fillRect(charX + 15, charY - 20, 4, 4);
        ctx.fillRect(charX + 31, charY - 20, 4, 4);
        ctx.beginPath();
        ctx.arc(charX + 25, charY - 12, 8, 0, Math.PI, false);
        ctx.stroke();

        // 🪓 ပုဆိန်
        ctx.fillStyle = "#9ca3af";
        if (playerSide === 'left') {
            ctx.fillRect(charX + 50, charY + 20, 30, 6); // လက်တံ/ကိုင်ထားပုံ
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.moveTo(charX + 80, charY + 15);
            ctx.lineTo(charX + 95, charY + 23);
            ctx.lineTo(charX + 80, charY + 31);
            ctx.fill();
        } else {
            ctx.fillRect(charX - 30, charY + 20, 30, 6);
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.moveTo(charX - 30, charY + 15);
            ctx.lineTo(charX - 45, charY + 23);
            ctx.lineTo(charX - 30, charY + 31);
            ctx.fill();
        }
    }

    // စတင်ချိန်မှာ ဂိမ်းကို စ run မည်
    initGame();
</script>

</body>
</html>
