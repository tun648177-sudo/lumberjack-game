<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumberJack Game</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    text-align: center;
    background: #87ceeb;
}

#game {
    height: 100vh;
    max-width: 500px;
    margin: auto;
    position: relative;
    overflow: hidden;
    background: linear-gradient(
        #87ceeb 0%,
        #dff6ff 55%,
        #6ab04c 55%
    );
}

#info {
    position: absolute;
    top: 15px;
    width: 100%;
    font-size: 24px;
    font-weight: bold;
    z-index: 5;
}

#score {
    margin-bottom: 5px;
}

#time {
    color: red;
}

#tree {
    position: absolute;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%);
    width: 100px;
    height: 500px;
}

#trunk {
    position: absolute;
    left: 35px;
    bottom: 0;
    width: 30px;
    height: 100%;
    background: #8b4513;
    border-radius: 8px;
}

.branch {
    position: absolute;
    width: 80px;
    height: 25px;
    background: #228b22;
    border-radius: 20px;
}

.left {
    left: -10px;
}

.right {
    right: -10px;
}

#axe {
    position: absolute;
    bottom: 105px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 60px;
    z-index: 10;
}

#buttons {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 20px;
    z-index: 20;
}

button {
    width: 130px;
    height: 65px;
    border: none;
    border-radius: 15px;
    font-size: 28px;
    font-weight: bold;
    background: white;
    box-shadow: 0 5px 0 #555;
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #555;
}

#over {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    color: white;
    z-index: 50;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

#over h1 {
    font-size: 45px;
}

#restart {
    width: 200px;
    font-size: 20px;
}
</style>
</head>

<body>

<div id="game">

    <div id="info">
        <div id="score">Score: 0</div>
        <div id="time">Time: 30</div>
    </div>

    <div id="tree">
        <div id="trunk"></div>
    </div>

    <div id="axe">🪓</div>

    <div id="buttons">
        <button onclick="chop('left')">⬅️</button>
        <button onclick="chop('right')">➡️</button>
    </div>

    <div id="over">
        <h1>GAME OVER</h1>
        <h2 id="final">Score: 0</h2>
        <button id="restart" onclick="restart()">
            🔄 PLAY AGAIN
        </button>
    </div>

</div>

<script>

let score = 0;
let time = 30;
let gameRunning = true;
let branches = [];

const tree = document.getElementById("tree");
const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");
const over = document.getElementById("over");
const finalScore = document.getElementById("final");

function createBranch() {

    const branch = document.createElement("div");

    const side = Math.random() < 0.5
        ? "left"
        : "right";

    branch.className = "branch " + side;

    branch.style.bottom =
        (Math.random() * 350 + 50) + "px";

    tree.appendChild(branch);

    branches.push({
        element: branch,
        side: side
    });
}

function chop(side) {

    if (!gameRunning) return;

    const branch = branches[0];

    if (branch && branch.side === side) {
        gameOver();
        return;
    }

    score++;

    scoreText.innerText =
        "Score: " + score;

    if (branches.length > 0) {
        branches[0].element.remove();
        branches.shift();
    }

    createBranch();
}

function gameOver() {

    gameRunning = false;

    finalScore.innerText =
        "Score: " + score;

    over.style.display = "flex";
}

function restart() {

    score = 0;
    time = 30;
    gameRunning = true;

    scoreText.innerText = "Score: 0";
    timeText.innerText = "Time: 30";

    over.style.display = "none";

    branches.forEach(function(branch) {
        branch.element.remove();
    });

    branches = [];

    createBranch();
}

function countdown() {

    if (!gameRunning) return;

    time--;

    timeText.innerText =
        "Time: " + time;

    if (time <= 0) {
        gameOver();
    }
}

createBranch();

setInterval(countdown, 1000);

</script>

</body>
</html>
